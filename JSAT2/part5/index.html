<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Movie App</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <!-- Main content for page -->
  <main class="container">
    <!-- h1 - page heading -->
    <h1>	&#127916; My Movie App  &#127909;</h1>
    <!-- Section search / sort -->
    <section class="search-sort">
      <!-- Search / Sort section heading -->
      <h2>Movie Search / Sort</h2>
      <!-- form to get the search string -->
      <form id="form-list-control">
        <div class="mb-3">
          <input 
            type="text" 
            placeholder="Movie name..." 
            name="search-string"
          >
        </div>
        <!-- Buttons to run search and sort functions -->
        <div class="mb-3">
          <button type="button" name="btn-search" id="searchBtn" >Search</button>
          <button type="button" name="btn-a2z" id="sortA2ZBtn" >Sort (A - Z)</button>
          <button type="button" name="btn-z2a" id="sortZ2ABtn" >Sort (Z - A)</button>
        </div>
      </form>
    </section>
    <!-- End of search / sort Section -->
    <!-- Start Movie list section -->
    <section id="mList">
      <!-- Movie List Section heading -->
      <h2 class="ml-3">Movie List</h2>
      <!-- Move list start -->
      <ol class="list" id="list"></ol>
      <!-- Movie list end -->
    </section>
    <!-- End of Movie list section -->
    <!-- Section to display messages -->
    <section id="msg" class="msgBox"></section>

    <!-- Start Tab Section -->
     <!-- The tabs -->
    <section class="tab">
      <!-- The buttons to change tabs -->
      <button class="tablinks" onclick="openForm(event, 'Add')" id="defaultOpen">Add a New Movie</button>
      <button class="tablinks active" onclick="openForm(event, 'Update')" >Update a Movie</button>
      <button class="tablinks" onclick="openForm(event, 'Delete')"> Delete a Movie</button>
    </section>
    <!-- End Tab Section -->

    <!-- The tab content. Made up of add movie / update movie / delete movie -->
    <!-- Add movie Form -->
    <section id="Add" class="tabcontent">
      <h2>Add a Movie</h2>
      <form id="form-add">
        <div class="mb-3">
          <label for="addMovieId">Movie ID: </label>
          <input type="number" placeholder="Movie ID..." name="movieId" id="addMovieId" min="1">
        </div>
        <div class="mb-3">
          <label for="addTitle">Title: </label>
          <input type="text" placeholder="Title..." name="title" id="addTitle">
        </div>
        <div class="mb-3">
          <label for="addYear">Year: </label>
          <input type="number" placeholder="Year..." name="year" id="addYear" min="1">
        </div>
        <div class="mb-3">
          <label for="addRating">Rating: </label>
          <input type="number" placeholder="Rating..." name="rating" id="addRating" min="1" max="5">
        </div>
        <button type="button" name="submit" id="addSubmit">Add Movie</button>
      </form>
    </section>
    <!-- End of Add movie Form -->
    
    <!-- Update movie Form -->
    <section id="Update" class="tabcontent">
      <h2>Update a Movie</h2>
      <form id="form-update">
        <div class="mb-3">
          <label for="upMovieId">Movie ID: </label>
          <input type="number" placeholder="Movie ID..." name="movieId" id="upMovieId" min="1">
        </div>
        <div class="mb-3">
          <label for="upTitle">Title: </label>
          <input type="text" placeholder="Title..." name="title" id="upTitle">
        </div>
        <div class="mb-3">
          <label for="upYear">Year: </label>
          <input type="number" placeholder="Year..." name="year" id="upYear" min="1">
        </div>
        <div class="mb-3">
          <label for="upRating">Rating: </label>
          <input type="number" placeholder="Rating..." name="rating" id="upRating" min="1" max="5">
        </div>
        <button type="button" name="submit" id="updateSubmit">Update Movie</button>
      </form>
    </section>
    <!-- End of Update movie Form -->

    <!-- Delete movie Form -->
    <section id="Delete" class="tabcontent">
      <h2>Delete a Movie</h2>
      <form id="form-delete">
        <div class="mb-3">
          <label for="delMovieId">Movie ID: </label>
          <input type="number" placeholder="Movie ID..." name="movieId" id="delMovieId" min="1">
        </div>
        <button type="button" name="submit" id="deleteSubmit"> Delete a Movie</button>
      </form>
    </section>
    <!-- End of Delete movie Form -->
    <!-- End of tab content -->

    <!-- Footer -->
    <footer>
      <div>
        <p>Copyright &copy; <span id="date"></span> My Movie App</p>
      </div>
    </footer>
    <!-- End of footer -->
  </main>
  <!-- End of main content -->


  <!-- Load in scripts -->
  <!-- Note: the order of the imports here is important -->
  <!-- Having the movie-list.js first allows the app.js to access the MovieList class defined -->
  <script src="./js/movie.js"></script>
  <script src="./js/movie-list.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
