<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Management</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="container">
    <h1>Movie Management</h1>

    <div class="top-grid">
      <section class="movie-panel" aria-labelledby="movie-list-heading">
        <h2 id="movie-list-heading">Movie List</h2>
        <ol class="list" id="list"></ol>
      </section>

      <section class="sort-panel" aria-labelledby="sort-heading">
        <h2 id="sort-heading">Sort by:</h2>
        <div class="sort-buttons">
          <button type="button" id="sortA2ZBtn">A-Z</button>
          <button type="button" id="sortZ2ABtn">Z-A</button>
          <button type="button" id="sortRatingBtn">Rating</button>
        </div>
        <button type="button" id="refreshBtn" class="refresh-button">Refresh</button>
      </section>
    </div>

    <section id="msg" class="msgBox" aria-live="polite"></section>

    <div class="bottom-grid">
      <section class="search-panel" aria-labelledby="search-heading">
        <div class="panel-tabs search-tabs">
          <h2 id="search-heading">Search with:</h2>
          <button type="button" id="searchByIdBtn" class="search-mode active" aria-pressed="true">ID</button>
          <button type="button" id="searchByTitleBtn" class="search-mode" aria-pressed="false">Title</button>
        </div>
        <form id="form-list-control" class="panel-body search-form">
          <div class="field-row">
            <label for="searchInput" id="searchLabel">Movie ID:</label>
            <input type="text" id="searchInput" name="search-string">
          </div>
          <button type="button" id="searchBtn" class="submit-button">Submit</button>
        </form>
      </section>

      <section class="maintenance-panel" aria-label="Movie maintenance">
        <div class="panel-tabs tab">
          <button type="button" class="tablinks" onclick="openForm(event, 'Add')" id="defaultOpen">Add</button>
          <button type="button" class="tablinks" onclick="openForm(event, 'Update')">Update</button>
          <button type="button" class="tablinks" onclick="openForm(event, 'Delete')">Delete</button>
        </div>

        <div id="Add" class="tabcontent panel-body">
          <form id="form-add" class="maintenance-form">
            <div class="field-row"><label for="addMovieId">Movie ID:</label><input type="number" name="movieId" id="addMovieId" min="1"></div>
            <div class="field-row"><label for="addTitle">Title:</label><input type="text" name="title" id="addTitle"></div>
            <div class="field-row"><label for="addYear">Year:</label><input type="number" name="year" id="addYear" min="1"></div>
            <div class="field-row"><label for="addRating">Rating:</label><input type="number" name="rating" id="addRating" min="1" max="5"></div>
            <button type="button" id="addSubmit" class="submit-button">Submit</button>
          </form>
        </div>

        <div id="Update" class="tabcontent panel-body">
          <form id="form-update" class="maintenance-form">
            <div class="field-row"><label for="upMovieId">Movie ID:</label><input type="number" name="movieId" id="upMovieId" min="1"></div>
            <div class="field-row"><label for="upTitle">Title:</label><input type="text" name="title" id="upTitle"></div>
            <div class="field-row"><label for="upYear">Year:</label><input type="number" name="year" id="upYear" min="1"></div>
            <div class="field-row"><label for="upRating">Rating:</label><input type="number" name="rating" id="upRating" min="1" max="5"></div>
            <button type="button" id="updateSubmit" class="submit-button">Submit</button>
          </form>
        </div>

        <div id="Delete" class="tabcontent panel-body">
          <form id="form-delete" class="maintenance-form">
            <div class="field-row"><label for="delMovieId">Movie ID:</label><input type="number" name="movieId" id="delMovieId" min="1"></div>
            <button type="button" id="deleteSubmit" class="submit-button">Submit</button>
          </form>
        </div>
      </section>
    </div>

    <footer><p>Copyright &copy; <span id="date"></span> My Movie App</p></footer>
  </main>

  <script src="./js/movie.js"></script>
  <script src="./js/movie-list.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
